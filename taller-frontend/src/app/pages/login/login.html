<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="login-card shadow-lg p-4 p-md-5">

    <div class="text-center mb-4">
      <div class="brand-avatar-box mx-auto mb-3">
        <i class="bi bi-wrench-adjustable-circle-fill text-warning"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">Taller Automotriz <span class="text-warning">RUJIM</span></h3>
      <p class="text-secondary-custom small mb-0">Sistema de Gestión y Control de Taller</p>
    </div>

    @if (error) {
      <div class="alert custom-alert-danger py-2 px-3 small d-flex align-items-center mb-4">
        <i class="bi bi-exclamation-circle-fill text-danger me-2"></i>
        <span>{{ error }}</span>
      </div>
    }

    <div class="mb-3">
      <label class="form-label small fw-semibold text-light">Correo electrónico</label>
      <div class="input-group login-input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" class="form-control" placeholder="admin@taller.com"
               [(ngModel)]="email" (keyup.enter)="login()">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small fw-semibold text-light">Contraseña</label>
      <div class="input-group login-input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" placeholder="••••••••"
               [(ngModel)]="password" (keyup.enter)="login()">
      </div>
    </div>

    <button class="btn btn-login-submit w-100 fw-bold py-2 mb-3" (click)="login()" [disabled]="cargando">
      @if (cargando) {
        <span class="spinner-border spinner-border-sm me-2"></span>
        <span>Ingresando...</span>
      } @else {
        <i class="bi bi-box-arrow-in-right me-2"></i>
        <span>Iniciar Sesión</span>
      }
    </button>

    <div class="text-center">
      <a routerLink="/consulta" class="back-link small">
        <i class="bi bi-arrow-left me-1"></i>Volver a Consulta Pública y Seguimiento
      </a>
    </div>

  </div>
</div>
