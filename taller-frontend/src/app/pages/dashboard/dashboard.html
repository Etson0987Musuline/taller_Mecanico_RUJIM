<div class="dashboard-layout" [class.sidebar-cerrado]="!menuAbierto">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a routerLink="/dashboard" class="d-flex align-items-center text-decoration-none sidebar-brand-link">
        <img src="/img/logo-icon.png" alt="RUJIM" class="sidebar-brand-icon me-2">
        <span class="sidebar-title">RUJIM</span>
      </a>
      <button class="btn-toggle ms-auto" (click)="menuAbierto = !menuAbierto">
        <i class="bi" [class.bi-layout-sidebar-inset]="menuAbierto" [class.bi-layout-sidebar]="!menuAbierto"></i>
      </button>
    </div>

    <nav class="sidebar-nav mt-3">
      <a *ngFor="let item of menuItems"
         [routerLink]="'/dashboard/' + item.path"
         routerLinkActive="activo"
         class="nav-item">
        <i class="bi {{ item.icono }}"></i>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="usuario-info">
        <div class="avatar">{{ usuario?.nombre?.charAt(0) }}</div>
        <div class="sidebar-title">
          <div class="fw-semibold small">{{ usuario?.nombre }}</div>
          <div class="text-muted" style="font-size:0.7rem">{{ usuario?.rol }}</div>
        </div>
      </div>
      <button class="btn btn-outline-danger btn-sm w-100 mt-2" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>
        <span class="nav-label">Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
